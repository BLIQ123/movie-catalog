<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноКаталог</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: #151c28;
            --bg-card-hover: #1e2738;
            --bg-header: rgba(11, 15, 23, 0.85);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(59, 130, 246, 0.5);
            --accent-gold: #f59e0b;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* Шапка */
        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg-header); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
        }

        .brand-block { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; user-select: none; }
        .logo { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-controls { display: flex; align-items: center; gap: 0.75rem; flex: 1; max-width: 950px; justify-content: flex-end; }

        .search-wrapper { position: relative; flex: 1; max-width: 320px; }
        .cyber-input {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-main); padding: 0.65rem 2.2rem 0.65rem 1rem; border-radius: var(--radius-md);
            font-size: 0.88rem; font-family: inherit; outline: none; transition: all 0.2s;
        }
        .cyber-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        .hotkey-badge {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 4px; pointer-events: none;
        }

        .cyber-select {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-main); padding: 0.65rem 1rem; border-radius: var(--radius-md);
            font-size: 0.88rem; font-family: inherit; outline: none; transition: all 0.2s; cursor: pointer;
        }
        .cyber-select:focus { border-color: var(--primary); }

        .btn-x {
            background: var(--primary); color: #fff; border: none; padding: 0.65rem 1.25rem;
            border-radius: var(--radius-md); font-weight: 600; font-size: 0.88rem; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; white-space: nowrap;
        }
        .btn-x:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .btn-ghost { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); }
        .btn-ghost:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.2); }
        .btn-ghost.active { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #f87171; }

        /* Переключатель вида (Сетка / Список) */
        .view-toggle { display: flex; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 2px; }
        .view-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.5rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .view-btn.active { background: var(--primary); color: #fff; }

        /* Hero Баннер */
        .hero-container { max-width: 1400px; margin: 1.5rem auto 0; padding: 0 2.5rem; }
        .hero-banner {
            position: relative; border-radius: var(--radius-lg); overflow: hidden; height: 320px;
            border: 1px solid var(--border); display: flex; align-items: center; padding: 2.5rem;
            background: linear-gradient(90deg, #0b0f17 35%, rgba(11, 15, 23, 0.4) 70%, transparent 100%),
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600&auto=format&fit=crop') center/cover;
        }
        .hero-content { max-width: 550px; z-index: 2; }
        .hero-tag { display: inline-block; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 6px; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .hero-title { font-size: 2.2rem; font-weight: 800; line-height: 1.2; margin-bottom: 0.6rem; }
        .hero-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Фильтры-чипсы */
        .chips-container {
            display: flex; gap: 0.6rem; overflow-x: auto; padding: 1.5rem 2.5rem 0;
            max-width: 1400px; margin: 0 auto; align-items: center;
        }
        .chip {
            font-size: 0.85rem; font-weight: 500;
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
            padding: 0.5rem 1.1rem; border-radius: 20px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .chip:hover, .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .reset-link { font-size: 0.8rem; color: #ef4444; margin-left: auto; cursor: pointer; display: none; text-decoration: underline; }

        /* Основной контент */
        main { max-width: 1400px; margin: 0 auto; padding: 1.75rem 2.5rem; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 0.6rem; }
        .counter-pill { font-size: 0.82rem; color: var(--text-muted); background: var(--bg-card); padding: 0.3rem 0.8rem; border-radius: 20px; border: 1px solid var(--border); }

        /* Сетка фильмов */
        .movies-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem; transition: all 0.3s;
        }

        /* Вид списком */
        .movies-grid.list-view { display: flex; flex-direction: column; gap: 1rem; }
        .movies-grid.list-view .movie-card { flex-direction: row; height: 140px; }
        .movies-grid.list-view .poster-container { width: 100px; height: 100%; aspect-ratio: auto; }
        .movies-grid.list-view .meta-container { padding: 0.5rem 1rem; flex: 1; }

        /* Карточка */
        .movie-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 0.6rem; display: flex; flex-direction: column; cursor: pointer;
            transition: all 0.25s ease; position: relative; overflow: hidden;
        }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--border-hover); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }

        .poster-container { position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: var(--radius-md); overflow: hidden; background: #000; }
        .poster-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .movie-card:hover .poster-img { transform: scale(1.05); }

        .quality-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.4rem; border-radius: 4px; backdrop-filter: blur(4px); }

        .rating-badge {
            position: absolute; top: 8px; left: 8px; z-index: 2;
            padding: 0.25rem 0.55rem; border-radius: 6px; font-weight: 700; font-size: 0.78rem;
            color: #fff; background: rgba(11, 15, 23, 0.85); backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 0.25rem;
        }
        .rating-star { color: var(--accent-gold); }

        .fav-button {
            position: absolute; top: 8px; right: 8px; z-index: 2;
            background: rgba(11, 15, 23, 0.85); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%; width: 34px; height: 34px; color: #fff; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(6px);
        }
        .fav-button:hover { transform: scale(1.1); background: #151c28; }
        .fav-button.active { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .meta-container { padding: 0.75rem 0.3rem 0.3rem; }
        .movie-title { font-size: 0.98rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.25rem; }
        .movie-sub { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease; padding: 1rem;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; max-width: 720px; width: 100%; overflow: hidden; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); transform: scale(0.95); transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-body-layout { padding: 2rem; display: flex; gap: 1.75rem; }
        .modal-poster-wrap { width: 220px; min-width: 220px; aspect-ratio: 2/3; border-radius: var(--radius-md); overflow: hidden; background: #000; }
        .modal-poster { width: 100%; height: 100%; object-fit: cover; }
        .modal-info { flex: 1; display: flex; flex-direction: column; }

        .modal-close {
            position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); color: var(--text-muted); width: 36px; height: 36px;
            border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .modal-close:hover { color: #fff; background: rgba(255,255,255,0.15); }

        #toastArea { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast-item {
            background: var(--bg-card); border: 1px solid var(--primary);
            color: #fff; padding: 0.75rem 1.25rem; border-radius: 10px; font-size: 0.88rem; font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); animation: fadeIn 0.2s, fadeOut 0.2s 2.8s forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }

        .empty-notice { grid-column: 1 / -1; text-align: center; padding: 5rem 1rem; color: var(--text-muted); font-size: 1rem; }

        @media (max-width: 850px) {
            header, main, .chips-container, .hero-container { padding-left: 1.25rem; padding-right: 1.25rem; }
            .hero-banner { height: auto; padding: 1.75rem; }
            .hero-title { font-size: 1.6rem; }
            .modal-body-layout { flex-direction: column; }
            .modal-poster-wrap { width: 100%; max-height: 280px; }
            .search-wrapper { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="toastArea"></div>

    <!-- Шапка -->
    <header>
        <div class="brand-block" onclick="resetCatalog()">
            <div class="logo">🎬 КиноКаталог</div>
        </div>

        <div class="nav-controls">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="cyber-input" placeholder="Поиск фильма...">
                <span class="hotkey-badge">/</span>
            </div>

            <select id="genreSelect" class="cyber-select">
                <option value="">Все жанры</option>
                <option value="Фантастика">Фантастика</option>
                <option value="Драма">Драма</option>
                <option value="Боевик">Боевик</option>
                <option value="Криминал">Криминал</option>
                <option value="Фэнтези">Фэнтези</option>
            </select>

            <select id="sortSelect" class="cyber-select">
                <option value="rating">По рейтингу ↓</option>
                <option value="year">По году ↓</option>
                <option value="title">По алфавиту</option>
            </select>

            <button class="btn-x btn-ghost" id="favFilterBtn" onclick="toggleFavOnly()">♥ Избранное</button>

            <!-- Переключатель Вида -->
            <div class="view-toggle">
                <button class="view-btn active" id="gridViewBtn" onclick="setViewMode('grid')" title="Сетка">⊞</button>
                <button class="view-btn" id="listViewBtn" onclick="setViewMode('list')" title="Список">☰</button>
            </div>
        </div>
    </header>

    <!-- Главный баннер рекомендуемого фильма -->
    <div class="hero-container">
        <div class="hero-banner" id="heroBanner">
            <div class="hero-content">
                <span class="hero-tag">🔥 Тренды недели</span>
                <h1 class="hero-title" id="heroTitle">Интерстеллар</h1>
                <p class="hero-desc" id="heroDesc">Наше время на Земле подошло к концу. Команда исследователей берет на себя самую важную миссию в истории человечества.</p>
                <button class="btn-x" onclick="playHeroMovie()">▶ Смотреть сейчас</button>
            </div>
        </div>
    </div>

    <!-- Чипсы жанров -->
    <div class="chips-container">
        <div class="chip active" onclick="selectChip('', this)">Все жанры</div>
        <div class="chip" onclick="selectChip('Фантастика', this)">🚀 Фантастика</div>
        <div class="chip" onclick="selectChip('Драма', this)">🎭 Драма</div>
        <div class="chip" onclick="selectChip('Боевик', this)">💥 Боевик</div>
        <div class="chip" onclick="selectChip('Криминал', this)">🕵️ Криминал</div>
        <div class="chip" onclick="selectChip('Фэнтези', this)">🪄 Фэнтези</div>
        <span class="reset-link" id="resetFiltersBtn" onclick="resetCatalog()">Сбросить фильтры</span>
    </div>

    <!-- Каталог -->
    <main>
        <div class="section-header">
            <h2 class="section-title" id="pageTitle">Все фильмы</h2>
            <div class="counter-pill" id="movieCounter">Загрузка...</div>
        </div>
        <div id="moviesGrid" class="movies-grid"></div>
    </main>

    <!-- Модальное окно просмотра -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            <div class="modal-body-layout" id="modalContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/movies';
        let allMovies = [];
        let favs = JSON.parse(localStorage.getItem('hyper_favs') || '[]');
        let showOnlyFavs = false;
        let activeHeroMovieId = null;

        function getPosterFallback(title) {
            const cleanTitle = (title || 'КИНО').substring(0, 20);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
                <rect width="100%" height="100%" fill="#151c28"/>
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="bold">${cleanTitle}</text>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        function showToast(text) {
            const area = document.getElementById('toastArea');
            const toast = document.createElement('div');
            toast.className = 'toast-item';
            toast.innerText = text;
            area.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function fetchMovies() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                allMovies = await res.json();
                
                if (allMovies.length > 0) {
                    updateHeroBanner(allMovies[0]);
                }
                applyFiltersAndRender();
            } catch (err) {
                document.getElementById('moviesGrid').innerHTML = 
                    `<div class="empty-notice">⚠️ Не удалось подключиться к API (127.0.0.1:8000).</div>`;
                document.getElementById('movieCounter').innerText = 'Ошибка';
            }
        }

        function updateHeroBanner(movie) {
            activeHeroMovieId = movie.id;
            document.getElementById('heroTitle').innerText = movie.title;
            document.getElementById('heroDesc').innerText = movie.description || 'Смотрите фильм прямо сейчас в высоком качестве.';
            const safeFallback = getPosterFallback(movie.title);
            document.getElementById('heroBanner').style.backgroundImage = 
                `linear-gradient(90deg, #0b0f17 35%, rgba(11, 15, 23, 0.4) 70%, transparent 100%), url('${movie.poster_url || safeFallback}')`;
        }

        function playHeroMovie() {
            if (activeHeroMovieId) openModal(activeHeroMovieId);
        }

        function applyFiltersAndRender() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const genre = document.getElementById('genreSelect').value;
            const sort = document.getElementById('sortSelect').value;

            // Показываем кнопку сброса, если задействованы фильтры
            const isFiltered = search || genre || showOnlyFavs;
            document.getElementById('resetFiltersBtn').style.display = isFiltered ? 'inline-block' : 'none';

            let filtered = allMovies.filter(m => {
                const matchSearch = m.title.toLowerCase().includes(search);
                const matchGenre = !genre || m.genre === genre;
                const matchFav = !showOnlyFavs || favs.includes(m.id);
                return matchSearch && matchGenre && matchFav;
            });

            filtered.sort((a, b) => {
                if (sort === 'rating') return (b.rating || 0) - (a.rating || 0);
                if (sort === 'year') return (b.year || 0) - (a.year || 0);
                if (sort === 'title') return a.title.localeCompare(b.title);
            });

            document.getElementById('movieCounter').innerText = `Найдено: ${filtered.length}`;
            renderCards(filtered);
        }

        function renderCards(movies) {
            const grid = document.getElementById('moviesGrid');
            if (movies.length === 0) {
                grid.innerHTML = `<div class="empty-notice">Фильмы не найдены 🔍</div>`;
                return;
            }

            grid.innerHTML = movies.map(m => {
                const isFav = favs.includes(m.id);
                const safeFallback = getPosterFallback(m.title);

                return `
                    <div class="movie-card" onclick="openModal(${m.id})">
                        <div class="poster-container">
                            <button class="fav-button ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${m.id})">
                                ${isFav ? '♥' : '♡'}
                            </button>
                            <div class="rating-badge">
                                <span class="rating-star">★</span> ${m.rating ? m.rating.toFixed(1) : '—'}
                            </div>
                            <span class="quality-badge">4K</span>
                            <img src="${m.poster_url || safeFallback}" 
                                 class="poster-img" 
                                 alt="${m.title}" 
                                 onerror="this.onerror=null; this.src='${safeFallback}';">
                        </div>
                        <div class="meta-container">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-sub">${m.year || '—'} • ${m.genre || 'Кино'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favs.includes(id)) {
                favs = favs.filter(i => i !== id);
                showToast('Удалено из избранного');
            } else {
                favs.push(id);
                showToast('Добавлено в избранное');
            }
            localStorage.setItem('hyper_favs', JSON.stringify(favs));
            applyFiltersAndRender();
        }

        function toggleFavOnly() {
            showOnlyFavs = !showOnlyFavs;
            document.getElementById('favFilterBtn').classList.toggle('active', showOnlyFavs);
            document.getElementById('pageTitle').innerText = showOnlyFavs ? 'Избранные фильмы' : 'Все фильмы';
            applyFiltersAndRender();
        }

        function selectChip(genre, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('genreSelect').value = genre;
            applyFiltersAndRender();
        }

        function setViewMode(mode) {
            const grid = document.getElementById('moviesGrid');
            const gridBtn = document.getElementById('gridViewBtn');
            const listBtn = document.getElementById('listViewBtn');

            if (mode === 'list') {
                grid.classList.add('list-view');
                listBtn.classList.add('active');
                gridBtn.classList.remove('active');
            } else {
                grid.classList.remove('list-view');
                gridBtn.classList.add('active');
                listBtn.classList.remove('active');
            }
        }

        function openModal(id) {
            const movie = allMovies.find(m => m.id === id);
            if (!movie) return;

            const safeFallback = getPosterFallback(movie.title);

            document.getElementById('modalContent').innerHTML = `
                <div class="modal-poster-wrap">
                    <img src="${movie.poster_url || safeFallback}" 
                         class="modal-poster" 
                         alt="${movie.title}" 
                         onerror="this.onerror=null; this.src='${safeFallback}';">
                </div>
                <div class="modal-info">
                    <div style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.4rem; font-weight: 500;">
                        ${movie.year || '—'} • ${movie.genre || 'Кино'}
                    </div>
                    <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 0.6rem; line-height: 1.2;">${movie.title}</h2>
                    <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent-gold); margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.3rem;">
                        ★ <span>${movie.rating ? movie.rating.toFixed(1) : '—'}</span> <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 400;">/ 10</span>
                    </div>
                    <p style="line-height: 1.6; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.75rem;">
                        ${movie.description || 'Описание фильма пока не написано.'}
                    </p>
                    <button class="btn-x" style="width: 100%; justify-content: center; padding: 0.8rem;" onclick="showToast('Запуск видеоплеера...')">
                        ▶ Смотреть Фильм
                    </button>
                </div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModalOnBackdrop(e) { if (e.target.id === 'modalOverlay') closeModalDirect(); }
        function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('active'); }

        function resetCatalog() {
            document.getElementById('searchInput').value = '';
            document.getElementById('genreSelect').value = '';
            showOnlyFavs = false;
            document.getElementById('favFilterBtn').classList.remove('active');
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            document.querySelector('.chip').classList.add('active');
            document.getElementById('pageTitle').innerText = 'Все фильмы';
            applyFiltersAndRender();
        }

        // Горячая клавиша / для поиска
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            } else if (e.key === 'Escape') {
                closeModalDirect();
            }
        });

        document.getElementById('searchInput').addEventListener('input', applyFiltersAndRender);
        document.getElementById('genreSelect').addEventListener('change', applyFiltersAndRender);
        document.getElementById('sortSelect').addEventListener('change', applyFiltersAndRender);

        fetchMovies();
    </script>
</body>
</html>
